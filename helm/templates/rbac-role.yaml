{{- if .Values.rbac.role.enabled -}}
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.rbac.role.roleName }}
  namespace: {{ .Values.rbac.role.roleNamespace }}
rules:
  - apiGroups:
      - "batch"
    resources:
      - jobs
  - verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  {{- end }}