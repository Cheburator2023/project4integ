apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "integration.fullname" . }}
  labels:
    {{- include "integration.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "integration.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        app: {{ include "integration.fullname" . }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.pullSecret }}
      {{- if .Values.affinity.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: DoesNotExist
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ template "integration.fullname" . }}-secret
          ports:
            - name: http
              containerPort: 5777
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 5777
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: kafka-cluster-ca-cert
              readOnly: true
              mountPath: /var/kafka-cluster-ca-cert
            - name: kafka-cluster-certs
              readOnly: true
              mountPath: /var/kafka-cluster-certs
            - name: ssh-keys-bitbucket
              readOnly: true
              mountPath: /.ssh
            {{- if .Values.logging.enabled }}
            - name: applog
              mountPath: /app/logs/
            {{- end }}
      {{- if .Values.logging.logrotate.enabled }}
        - name: {{ .Values.logging.logrotate.docker.name }}
          image: "{{ .Values.logging.logrotate.docker.repository }}/{{ .Values.logging.logrotate.docker.name }}:{{ .Values.logging.logrotate.docker.tag }}"
          imagePullPolicy: {{ .Values.logging.logrotate.docker.pullPolicy }}
          env:
            {{- range $key, $val := .Values.logging.logrotate.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.logging.logrotate.resources | nindent 12 }}
          volumeMounts:
            - name: applog
              mountPath: /app/logs/
      {{- end }}
      {{- if .Values.logging.enabled }}
        - name: {{ .Values.logging.fluentd.docker.name }}
          image: "{{ .Values.logging.fluentd.docker.repository }}/{{ .Values.logging.fluentd.docker.name }}:{{ .Values.logging.fluentd.docker.tag }}"
          imagePullPolicy: {{ .Values.logging.fluentd.docker.pullPolicy }}
          env:
            - name: FLUENTD_USER
              valueFrom:
                secretKeyRef:
                  key: FLUENTD_USER
                  name: {{ template "integration.fullname" . }}-secret
            - name: FLUENTD_PWD
              valueFrom:
                secretKeyRef:
                  key: FLUENTD_PWD
                  name: {{ template "integration.fullname" . }}-secret
            {{- range $key, $val := .Values.logging.fluentd.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.logging.fluentd.resources | nindent 12 }}
          readinessProbe:
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
            exec:
              command:
                - echo
                - good
          volumeMounts:
            - name: {{ include "integration.fullname" . }}-fluent-agent-config
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf
            - name: applog
              mountPath: /app/logs/
          {{- if .Values.logging.fluentd.livenessprobe.enabled }}
          livenessProbe:
            initialDelaySeconds: {{ .Values.logging.fluentd.livenessprobe.initialdelayseconds }}
            periodSeconds: {{ .Values.logging.fluentd.livenessprobe.periodseconds }}
            exec:
              command:
                - '/bin/sh'
                - '-c'
                - >
                  LIVENESS_THRESHOLD_SECONDS=${LIVENESS_THRESHOLD_SECONDS:-300};
                  STUCK_THRESHOLD_SECONDS=${STUCK_THRESHOLD_SECONDS:-900};
                  if [ ! -e /var/log/fluentd-buffers ];
                  then
                    exit 1;
                  fi;
                  touch -d "${STUCK_THRESHOLD_SECONDS} seconds ago" /tmp/marker-stuck;
                  if [ -z "$(find /var/log/fluentd-buffers -type d -newer /tmp/marker-stuck -print -quit)" ];
                  then
                    rm -rf /var/log/fluentd-buffers;
                    exit 1;
                  fi;
                  touch -d "${LIVENESS_THRESHOLD_SECONDS} seconds ago" /tmp/marker-liveness;
                  if [ -z "$(find /var/log/fluentd-buffers -type d -newer /tmp/marker-liveness -print -quit)" ];
                  then
                    exit 1;
                  fi;
          {{- end }}
      {{- end }}
      volumes:
        - name: kafka-cluster-ca-cert
          secret:
            secretName: {{ .Values.secret_kafka }}
            items:
              - key: ca.pem
                path: ca.pem
            defaultMode: 420
        - name: kafka-cluster-certs
          secret:
            secretName: {{ .Values.secret_kafka }}
            items:
              - key: cert.pem
                path: cert.pem
              - key: key.pem
                path: key.pem
        - name: ssh-keys-bitbucket
          secret:
            secretName: {{ .Values.secret_ssh_keys_bitbucket }}
            items:
              - key: id_rsa
                path: id_rsa
              - key: id_rsa.pub
                path: id_rsa.pub
              - key: known_hosts
                path: known_hosts
            defaultMode: 384
        {{- if .Values.logging.enabled }}
        - name: applog
          emptyDir: {}
        - name: {{ include "integration.fullname" . }}-fluent-agent-config
          configMap:
            name: {{ include "integration.fullname" . }}-fluent-agent-config
        {{- end }}
