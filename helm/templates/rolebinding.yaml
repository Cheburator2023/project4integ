{{- if .Values.rbac.roleBinding.enabled -}}
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.rbac.role.roleBindingName }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.rbac.role.serviceAccountName }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.rbac.role.roleName }}
{{- end }}